services:
  - type: web
    name: zohaib-portfolio-lab3
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: PortfolioLab3
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
